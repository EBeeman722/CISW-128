<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- linking to .css files goes here-->
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <div>
        <!-- a generic container with no meaning itself for styling and layout-->
    </div>

    <!-- Semantic tags-->
     <header>
        <!-- top section of a page or section, usually with a logo/title/intro-->
     </header>

     <nav>
        <!-- navigation links to other pages or sections-->
     </nav>

    <main>
        <!-- this is the stuff for your website, where most of your work will go-->
        <section>
        <!-- go inside <main> tags, groups related content inside, like chapters in a book-->
        </section>
    </main>

    <footer>
        <!-- bottom of a webpage, usually holding copyright and/or contact info-->
    </footer>

    <ul>
        <!-- unordered list, bullet points-->
    </ul>

    <ol>
        <!-- ordered list, numbered-->
    </ol>

    <li>
        <!-- list item-->
    </li>

    <ul>
        <!-- same principal applies for the <ol> tag-->
        <li>oranges</li>
        <li>apples</li>
    </ul>

    <table border="1px"> 
        <!-- tag for tables, contains the table-->

        <tr>
        <!-- table row, used for every different row made -->

            <th>
            <!-- displays information at the top of the table-->
             plotpoint 1
            </th>
        </tr>

        <tr>

            <td>
            <!-- table data -->
             data 1
            </td>
        </tr>
    </table>

</body>
</html>
