<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Homework 12 Beeman</title> 
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Contact Info Form</h1> 
    <h2>Please list your contact information here.</h2>
  <form id="userInfo"> 
    <label for="name">Name:</label>
<br>
    <input id="name" type="text" placeholder="Your name" required />
<br>
<br>

    <label for="email">Email:</label>
    <br>
    <input id="email" type="email" placeholder="you@example.com" required />
<br>
<br>
 <label for="email">Alternative Email: (Not Required)</label>
    <br>
    <input id="email" type="email" placeholder="you@example.com"/>
<br>
<br>

    <label for="message">Inquiry: </label><br>
    <textarea id="message" rows="3" placeholder="Write something..."></textarea>

<br>
<br>
    <label for="PMC">Preferred Method of Contact:</label>
<br>
    <select id="PMC">
    <option value="Email">Email</option>
    <option value="Text">SMS Message</option>
    <option value="Call">Phone Call</option>
    </select>
<br>
<br>
    <p id="Newsletter">Would you like updates from our newsletter?</p>
    <br>
    <label>
    <input type="radio" name="Newsletter" value="No"> No <br>
    <input type="radio" name="Newsletter" value="Yes"> Yes
</label>
<br>
<br>
    <button type="submit">Submit Form</button> 
</form>
  <section id="display"></section> 

  <script src="scripts.js"></script> 
</body>
</html>
